---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: radioterio2
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/pyldin601/servers.git'
    path: k8s/casa/apps/radioterio2
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: radioterio2
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # The first sync waits on the secrets, Postgres and MinIO; retry instead of staying failed.
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
