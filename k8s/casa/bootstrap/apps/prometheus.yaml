---
# Prometheus for casa, dashboards only (no Alertmanager). Scrapes pods and services annotated with
# prometheus.io/scrape (zoom3d server, LiveKit), the node (node-exporter) and cluster state (kube-state-metrics).
# Grafana (apps/grafana) reads it at http://prometheus-server.monitoring.svc.cluster.local.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  finalizers:
      - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: prometheus
    targetRevision: 29.36.1
    helm:
      valuesObject:
        alertmanager:
          enabled: false
        prometheus-pushgateway:
          enabled: false
        server:
          strategy:
            type: Recreate
          global:
            scrape_interval: 15s
          retention: 15d
          persistentVolume:
            size: 8Gi
            storageClass: local-path
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
