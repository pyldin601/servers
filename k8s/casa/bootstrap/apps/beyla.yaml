---
# Beyla for casa: an eBPF agent on the node that turns the requests pods receive and send (HTTP, gRPC, SQL, Redis)
# into trace spans and sends them to Tempo (bootstrap/apps/tempo.yaml). No app changes: it watches from the kernel.
# Traces only: the Prometheus exporter is off.
#
# Traced: only the namespaces listed under discovery.instrument. Spans carry the URLs of the calls a pod receives
# and makes (path and query string), stored in Tempo for 7 days, so a namespace goes on the list only if its pods
# don't call APIs that put a credential in the URL. Left out for that reason: homefs-hub, torrent-bot and
# polyglot-bot (the Telegram Bot API has the bot token in the path; OMDb takes ?apikey=). Filtering those calls by
# host doesn't work: Beyla often has only the IP.
#
# Limits on this node:
#   - Kernel 5.15: no trace context between services (needs 5.17), so each service's requests are their own traces.
#   - nodejs.enabled is true: Beyla signals each traced Node.js process (SIGUSR1) to open its inspector on
#     127.0.0.1:9229 inside the pod and injects an agent that ties outgoing calls to the request that made them.
#     Set it to false to leave the processes alone; a Node.js service's outgoing calls then show up as separate
#     traces instead of nested under the request.
#   - An app that sends its own OpenTelemetry traces is left alone (exclude_otel_instrumented_services, on by default).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: beyla
  namespace: argocd
  finalizers:
      - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    chart: beyla
    targetRevision: 1.16.17
    helm:
      valuesObject:
        # A list of Linux capabilities instead of a privileged container, and no host network.
        privileged: false
        contextPropagation:
          enabled: false
        # KILL lets Beyla signal Node.js processes that run as another user; the Node.js agent needs that.
        extraCapabilities:
          - KILL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 1Gi
        config:
          data:
            discovery:
              instrument:
                - k8s_namespace: zoom3d
                - k8s_namespace: pingodoce-mcp
                - k8s_namespace: radioterio2
            # Readiness checks ping Redis every few seconds; their own request is dropped below, so the ping would
            # be left as a trace of its own.
            filter:
              application:
                db.operation.name:
                  not_match: PING
            nodejs:
              enabled: true
            otel_traces_export:
              endpoint: http://tempo.monitoring.svc.cluster.local:4318
            prometheus_export:
              port: 0
            routes:
              # Probes and Prometheus scrapes: every few seconds per pod, never worth a trace.
              ignored_patterns:
                - /healthz
                - /readyz
                - /health
                - /api/health
                - /minio/health/*
                - /metrics
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
