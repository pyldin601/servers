---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: torrent-bot-runner
spec:
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 0
  schedule: "*/30 9-22 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          volumes:
            - name: db-volume
              persistentVolumeClaim:
                claimName: db-volume-claim
          containers:
            - name: torrent-bot
              image: pldin601/torrent-bot-runner@sha256:a7878cc77b59241e85a106b93ba3ef208c5ab21c71c52b45a27e0fab72a97f0d
              volumeMounts:
                - mountPath: /storage
                  name: db-volume
              env:
                # Spans go to Tempo (bootstrap/apps/tempo.yaml). The app never records the bot token or passwords.
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: http://tempo.monitoring.svc.cluster.local:4318
                - name: STORAGE_FILE
                  value: /storage/torrent-bot.db
                - name: TRANS_URL
                  value: http://transmission-daemon:9091/transmission/rpc
                - name: TRANS_DOWNLOAD_DIRECTORY
                  value: /data
                - name: TOLOKA_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: toloka-secret
                      key: USERNAME
                - name: TOLOKA_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: toloka-secret
                      key: PASSWORD
                - name: TELEGRAM_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: telegram-secret
                      key: TOKEN
                - name: TELEGRAM_BOT_CHAT_ID
                  value: "384980395"
                - name: CLIENT_ENDPOINT
                  value: "http://torrent-bot-server:8080"
                - name: SERVER_ENDPOINT
                  value: "http://torrent-bot-server:8080"
          restartPolicy: OnFailure
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-volume-claim
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
