---
kind: Service
apiVersion: v1
metadata:
  name: torrent-bot-server
spec:
  selector:
    deployment: torrent-bot-server
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: torrent-bot-server
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      deployment: torrent-bot-server
  template:
    metadata:
      labels:
        deployment: torrent-bot-server
    spec:
      containers:
        - name: torrent-bot-server
          image: pldin601/torrent-bot-server@sha256:3bccebea38ce8dcc76c987f1bde08875d2ba3fffb080b0d965b7e4f8ac397958
          env:
            # Spans go to Tempo (bootstrap/apps/tempo.yaml). The app never records the bot token or passwords.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.monitoring.svc.cluster.local:4318
            - name: TRANS_URL
              value: http://transmission-daemon:9091/transmission/rpc
            - name: TOLOKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: toloka-secret
                  key: USERNAME
            - name: TOLOKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: toloka-secret
                  key: PASSWORD
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-secret
                  key: TOKEN
            - name: TELEGRAM_BOT_CHAT_ID
              value: "384980395"
