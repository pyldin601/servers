# MinIO: the S3 store for uploaded tracks and images. The API makes the bucket on start (S3_CREATE_BUCKET).
# Each user may store 2 GiB. The PVC size is not enforced by local-path; watch the node's disk.
# The same image as the project's tests (tests/compose.yaml); it runs as uid 1001.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio
  namespace: radioterio2
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # Every user's uploads: never prune or delete it with the Application; remove it by hand if that is really meant.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: radioterio2
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1001
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio
      containers:
        - name: minio
          image: bitnamilegacy/minio:2025.7.23
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: radioterio2-secrets
                  key: S3_ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radioterio2-secrets
                  key: S3_SECRET_ACCESS_KEY
            - name: MINIO_BROWSER
              value: "off"
          volumeMounts:
            - name: data
              mountPath: /bitnami/minio/data
          ports:
            - containerPort: 9000
              name: s3
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: radioterio2
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
