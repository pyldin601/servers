# Postgres for radioterio2: users, stations, playlists, encrypted stream keys. One replica on the node's local-path
# volume. Postgres 17, the same as the project's CI.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres
  namespace: radioterio2
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # Every user's data: never prune or delete it with the Application; remove it by hand if that is really meant.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: radioterio2
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  revisionHistoryLimit: 1
  # Never two servers on one data directory.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      enableServiceLinks: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: radioterio
            - name: POSTGRES_DB
              value: radioterio
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radioterio2-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "radioterio", "-d", "radioterio"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "radioterio", "-d", "radioterio"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: radioterio2
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
