# NATS: commands from the API to the station engines, and their events and state back. Core NATS only, nothing kept,
# so a restart loses no data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: radioterio2
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      enableServiceLinks: false
      containers:
        - name: nats
          image: nats:2.11-alpine
          args: ["--http_port", "8222"]
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8222
              name: monitoring
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitoring
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitoring
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: radioterio2
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: ClusterIP
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: client
