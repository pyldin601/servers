# Made with kubeseal (kube-system/sealed-secrets-controller). Only this cluster can open it.
# Random values: the Postgres password, the key that encrypts stream keys (base64 of 32 bytes; changing it makes every
# saved stream key unreadable), and the MinIO credentials, which the API also uses for S3.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: radioterio2-secrets
  namespace: radioterio2
spec:
  encryptedData:
    DATABASE_URL: 
    POSTGRES_PASSWORD: 
    S3_ACCESS_KEY_ID: 
    S3_SECRET_ACCESS_KEY: 
    STREAM_KEY_SECRET: 
  template:
    metadata:
      name: radioterio2-secrets
      namespace: radioterio2
