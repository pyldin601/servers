# Pull secret for the private ghcr.io/radioterio/* images, from RADIOTERIO_GHCR_DOCKERCONFIGJSON in
# prod/homefs/global (see apps/myownradio/radioterio-ghcr-pullsecret.yaml for its format).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-dockerconfig
  namespace: radioterio2
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: external-secretstore
    kind: ClusterSecretStore
  target:
    name: ghcr-dockerconfig
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: prod/homefs/global
        property: RADIOTERIO_GHCR_DOCKERCONFIGJSON
