# The basic-auth users (htpasswd, bcrypt) live in AWS Secrets Manager: prod/homefs/global, THEGOALBOOK_BASIC_AUTH_USERS.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: basic-auth
  namespace: thegoalbook
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: external-secretstore
    kind: ClusterSecretStore
  target:
    name: basic-auth
    creationPolicy: Owner
  data:
    - secretKey: users
      remoteRef:
        key: prod/homefs/global
        property: THEGOALBOOK_BASIC_AUTH_USERS
