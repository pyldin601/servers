apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: arbitrary

commonLabels:
  app: myownradio

images:
  # radioterio — bump all three together to the sha- tag of the
  # radioterio/radioterio commit you want deployed (the base manifests say
  # :latest; these pins are what actually ships).
  - name: ghcr.io/radioterio/radioterio-frontend
    newTag: sha-c3f7505
  - name: ghcr.io/radioterio/api-server
    newTag: sha-c3f7505
  - name: ghcr.io/radioterio/playback-server
    newTag: sha-c3f7505

  - name: pldin601/myownradio-radiomanager-web-egress-controller
    newTag: 23.11.6995128147-3fe4a0b
  - name: pldin601/myownradio-radiomanager-web-egress-process
    newTag: 23.11.6797136598-78f80d4 # <---------------------------------
#                                                                       |
#                                                                       |
configMapGenerator: #                                       Should be updated together!
  - name: image-tag-config #                                            |
    literals: #                                                         |
      - WEB_EGRESS_PROCESS_IMAGE_TAG=23.11.6797136598-78f80d4 # <--------

resources:
  - myownradio-ns.yaml
  - myownradio-dockerconfig-sealedsecret.yaml

  # mysql
  - myownradio-mysql-deployment.yaml
  - myownradio-mysql-service.yaml
  - myownradio-mysql-pvc.yaml
  - myownradio-mysql-configmap.yaml
  - mysql-migration-job.yaml
  - mysql-database-backup.yaml

  # radioterio — the rebuild (repo radioterio/radioterio, images from GHCR)
  - radioterio-ghcr-pullsecret.yaml
  - radioterio-api-server.yaml
  - radioterio-playback-server.yaml
  - radioterio-frontend.yaml
  # Owns the radioter.io root since the 2026-08-06 cutover (replaced the
  # clone; its leftover IngressRoute must not exist in-cluster).
  - radioterio-frontend-ingressroute.yaml

# Decommissioned legacy manifests live in unused/ (kept for reference).
