---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radioterio-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      deployment: radioterio-frontend
  template:
    metadata:
      labels:
        deployment: radioterio-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-dockerconfig
      containers:
        - name: frontend
          # Built by radioterio/radioterio's "Build images" workflow.
          # `latest` to bootstrap; pin to a sha-XXXXXXX tag once images flow.
          image: ghcr.io/radioterio/radioterio-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            # Server-only backend base URL (ADR-002: the browser talks only to
            # this app's origin; uploads and station streams relay through it).
            - name: API_URL
              value: http://radioterio-api-server:4001
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Anonymous / renders the landing page with no backend dependency.
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
kind: Service
apiVersion: v1
metadata:
  name: radioterio-frontend
spec:
  selector:
    deployment: radioterio-frontend
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
