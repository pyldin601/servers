---
# Pull secret for the private ghcr.io/radioterio/* images, materialized from
# AWS Secrets Manager. Add RADIOTERIO_GHCR_DOCKERCONFIGJSON to
# prod/homefs/global with the full dockerconfigjson document:
#
#   {"auths":{"ghcr.io":{"auth":"<base64 of GITHUB_USERNAME:PAT>"}}}
#
# where the PAT is a classic token with read:packages only.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-dockerconfig
  namespace: myownradio
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: external-secretstore
    kind: ClusterSecretStore
  target:
    name: ghcr-dockerconfig
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: prod/homefs/global
        property: RADIOTERIO_GHCR_DOCKERCONFIGJSON
