---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radiomanager-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      deployment: radiomanager-frontend
  template:
    metadata:
      labels:
        deployment: radiomanager-frontend
    spec:
      containers:
        - name: radiomanager-frontend
          image: pldin601/myownradio-radiomanager-frontend:26.08.30930861750-e5b218a
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "750m"
          env:
            - name: DUMMY
              value: "0"
      imagePullSecrets:
        - name: dockerconfig
---
kind: Service
apiVersion: v1
metadata:
  name: radiomanager-frontend
spec:
  selector:
    deployment: radiomanager-frontend
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: radiomanager-frontend
  namespace: myownradio
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      # The app is built with basePath /v2, so no prefix stripping.
      match: Host(`radioter.io`) && PathPrefix(`/v2`)
      middlewares: []
      services:
        - kind: Service
          name: radiomanager-frontend
          port: 3000
          scheme: http
  tls:
    certResolver: default
