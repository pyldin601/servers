# Secrets live in AWS Secrets Manager (prod/homefs/global), as PINGODOCE_* properties. The app's own five are added by
# `node scripts/put-secrets.ts` in the pingodoce-mcp repo; PINGODOCE_GHCR_DOCKERCONFIGJSON is added by hand:
#
#   {"auths":{"ghcr.io":{"auth":"<base64 of GITHUB_USERNAME:PAT>"}}}
#
# where the PAT is a classic token with read:packages only (the images are private).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pingodoce-secrets
  namespace: pingodoce-mcp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: external-secretstore
    kind: ClusterSecretStore
  target:
    name: pingodoce-secrets
    creationPolicy: Owner
    template:
      data:
        POSTGRES_PASSWORD: "{{ .postgresPassword }}"
        DATABASE_URL: "postgres://pingodoce:{{ .postgresPassword }}@pingodoce-postgres:5432/pingodoce"
        OIDC_JWKS: "{{ .oidcJwks }}"
        OIDC_COOKIE_KEYS: "{{ .oidcCookieKeys }}"
        COOKIE_JAR_KEYS: "{{ .cookieJarKeys }}"
        IDENTIFIER_HMAC_KEY: "{{ .identifierHmacKey }}"
  data:
    - secretKey: postgresPassword
      remoteRef:
        key: prod/homefs/global
        property: PINGODOCE_POSTGRES_PASSWORD
    - secretKey: oidcJwks
      remoteRef:
        key: prod/homefs/global
        property: PINGODOCE_OIDC_JWKS
    - secretKey: oidcCookieKeys
      remoteRef:
        key: prod/homefs/global
        property: PINGODOCE_OIDC_COOKIE_KEYS
    - secretKey: cookieJarKeys
      remoteRef:
        key: prod/homefs/global
        property: PINGODOCE_COOKIE_JAR_KEYS
    - secretKey: identifierHmacKey
      remoteRef:
        key: prod/homefs/global
        property: PINGODOCE_IDENTIFIER_HMAC_KEY
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-dockerconfig
  namespace: pingodoce-mcp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: external-secretstore
    kind: ClusterSecretStore
  target:
    name: ghcr-dockerconfig
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: prod/homefs/global
        property: PINGODOCE_GHCR_DOCKERCONFIGJSON
