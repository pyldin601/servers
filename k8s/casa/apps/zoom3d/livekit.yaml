# LiveKit SFU (with its built-in TURN) carrying all of zoom3d's audio and video (the mesh is gone since
# zoom3d PR #53). The zoom3d server signs tokens with the livekit-keys secret.
#
# Host network, so media ports are the node's own ports. It reuses the router forwards to 192.168.1.78
# that were made for coturn: UDP 3478 (TURN/STUN) and UDP 49160-49999 (media 49160-49163, TURN relays
# 49170-49999), plus TCP 7881 (ICE/TCP, for networks that block UDP).
# TURN relays to the SFU through the public IP, which needs the router to hairpin UDP: it does since 2026-10-11
# (LiveKit validates its external IP; a relay-only client works). The node needs net.core.rmem_max >= 5000000
# (/etc/sysctl.d/90-livekit.conf on the host), or LiveKit warns its UDP receive buffer is too small.
#   wss://lk.pyldin601.xyz   signalling + API, through Traefik (IngressRoute below)
#   turns:turn.pyldin601.xyz:443   Traefik terminates TLS and forwards plain TCP to 5349 (external_tls)
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit
  namespace: zoom3d
data:
  livekit.yaml: |
    port: 7880
    # Scraped by casa's Prometheus (pod annotations below); node port, not forwarded on the router.
    prometheus:
      port: 6789
    logging:
      level: info
    rtc:
      # All media over a small UDP mux, one port per core.
      udp_port: 49160-49163
      tcp_port: 7881
      # Advertise the public IP (found via STUN at start) and the LAN IP, for clients at home.
      use_external_ip: true
      advertise_internal_ip: true
      # Only the LAN address: never flannel/cni (10.42.x) addresses.
      ips:
        includes:
          - 192.168.1.0/24
    turn:
      enabled: true
      domain: turn.pyldin601.xyz
      udp_port: 3478
      tls_port: 5349
      external_tls: true
      # Traefik dials from its pod IP; PROXY protocol v2 carries the real client address.
      proxy_protocol: true
      proxy_protocol_trusted_cidrs:
        - 10.42.0.0/16
        - 192.168.1.78/32
      relay_range_start: 49170
      relay_range_end: 49999
  # The home IP is dynamic and LiveKit only discovers it at start: exit when it changes, so the
  # kubelet restarts the container and LiveKit advertises the new one.
  run.sh: |
    #!/bin/sh
    set -eu
    public_ip() {
      nslookup myip.opendns.com resolver1.opendns.com 2>/dev/null | awk '/^Address: / { ip = $2 } END { print ip }'
    }
    start_ip=$(public_ip || true)
    echo "livekit: public ip ${start_ip:-unknown}"
    /livekit-server --config /etc/livekit/livekit.yaml &
    pid=$!
    trap 'kill -TERM "$pid"; wait "$pid" || true; exit 0' TERM INT
    while kill -0 "$pid" 2>/dev/null; do
      sleep 60 &
      wait $! || true
      ip=$(public_ip || true)
      if [ -n "$ip" ] && [ -n "$start_ip" ] && [ "$ip" != "$start_ip" ]; then
        echo "livekit: public ip changed from $start_ip to $ip, restarting"
        kill -TERM "$pid"
        wait "$pid" || true
        exit 1
      fi
      [ -n "$start_ip" ] || start_ip=$ip
    done
    echo "livekit: livekit-server exited"
    exit 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: zoom3d
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # Host ports: never two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "6789"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Service env vars like LIVEKIT_PORT=tcp://... would be read as LiveKit settings.
      enableServiceLinks: false
      volumes:
        - name: config
          configMap:
            name: livekit
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.13.9
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/etc/livekit/run.sh"]
          env:
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef:
                  name: livekit-keys
                  key: LIVEKIT_KEYS
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 7880
              name: http
              protocol: TCP
            - containerPort: 5349
              name: turn-tls
              protocol: TCP
            - containerPort: 3478
              name: turn-udp
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /
              port: 7880
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 7880
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              memory: 2Gi
---
# Lets Traefik reach the host-network pod (its endpoint is the node IP).
apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: zoom3d
spec:
  type: ClusterIP
  selector:
    app: livekit
  ports:
    - name: http
      port: 7880
      targetPort: 7880
      protocol: TCP
    - name: turn-tls
      port: 5349
      targetPort: 5349
      protocol: TCP
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: livekit
  namespace: zoom3d
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`lk.pyldin601.xyz`)
      kind: Rule
      services:
        - name: livekit
          port: 7880
  tls:
    certResolver: default
---
# turns:turn.pyldin601.xyz:443 for networks that only allow HTTPS. Matches by SNI, so the HTTP
# routers on websecure are unaffected.
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRouteTCP
metadata:
  name: livekit-turn-tls
  namespace: zoom3d
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`turn.pyldin601.xyz`)
      services:
        - name: livekit
          port: 5349
          proxyProtocol:
            version: 2
  tls:
    certResolver: default
