# Temporary preview of zoom3d PR #53 (media through LiveKit) at https://zoom3d-next.pyldin601.xyz, to test with real
# devices outside the home network before prod switches. Uses the same LiveKit (and its keys) as prod will; rooms
# are separate (random room ids). No state file: rooms live in memory only. Remove this file (and its kustomization
# entry) once the PR is merged and deployed.
# Images are the PR's moving `pr-53` tag (CI pushes it on every PR commit): restart to pick up a new push.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoom3d-next-server
  namespace: zoom3d
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zoom3d-next-server
  template:
    metadata:
      labels:
        app: zoom3d-next-server
    spec:
      containers:
        - name: zoom3d-server
          image: ghcr.io/pyldin601/zoom3d-server:pr-53
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "8787"
            - name: LIVEKIT_URL
              value: wss://lk.pyldin601.xyz
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: livekit-keys
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: livekit-keys
                  key: LIVEKIT_API_SECRET
          ports:
            - containerPort: 8787
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: zoom3d-next-server
  namespace: zoom3d
spec:
  type: ClusterIP
  selector:
    app: zoom3d-next-server
  ports:
    - name: http
      port: 8787
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoom3d-next-web
  namespace: zoom3d
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: zoom3d-next-web
  template:
    metadata:
      labels:
        app: zoom3d-next-web
    spec:
      containers:
        - name: zoom3d-web
          image: ghcr.io/pyldin601/zoom3d-web:pr-53
          imagePullPolicy: Always
          env:
            # Fallback only: Traefik routes /ws straight to the server.
            - name: SERVER_URL
              value: http://zoom3d-next-server.zoom3d.svc.cluster.local:8787
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: zoom3d-next-web
  namespace: zoom3d
spec:
  type: ClusterIP
  selector:
    app: zoom3d-next-web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: zoom3d-next
  namespace: zoom3d
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`zoom3d-next.pyldin601.xyz`) && Path(`/ws`)
      services:
        - kind: Service
          name: zoom3d-next-server
          port: http
          scheme: http
    - kind: Rule
      match: Host(`zoom3d-next.pyldin601.xyz`)
      services:
        - kind: Service
          name: zoom3d-next-web
          port: http
          scheme: http
  tls:
    certResolver: default
